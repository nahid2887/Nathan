services:
  # ─── PostgreSQL ───────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nathan_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-nathan_db}
      POSTGRES_USER: ${DB_USER:-nathan_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-nathan_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nathan_user} -d ${DB_NAME:-nathan_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nathan_net

  # ─── Redis (for Django Channels) ──────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: nathan_redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - nathan_net

  # ─── Django + Daphne (ASGI) ───────────────────────────────────────────
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nathan_web
    restart: unless-stopped
    env_file:
      - .env.docker
    # No longer expose port directly – Nginx is the only public entry point
    expose:
      - "4003"
    volumes:
      - media_data:/app/media
      - static_data:/app/static
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nathan_net

  # ─── Nginx (reverse proxy + SSL) ──────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nathan_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - static_data:/app/static:ro
      - media_data:/app/media:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - web
    networks:
      - nathan_net

  # ─── Certbot (Let's Encrypt SSL) ──────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: nathan_certbot
    volumes:
      - ./nginx/ssl:/etc/letsencrypt/live/hoodlink.duckdns.org
      - certbot_www:/var/www/certbot
    # Run manually with:  docker compose run --rm certbot certonly ...
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done"

volumes:
  postgres_data:
  media_data:
  static_data:
  certbot_www:

networks:
  nathan_net:
    driver: bridge
